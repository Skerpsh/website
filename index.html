<!DOCTYPE html>
<html lang="us">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8" />

        <!--Style for Background-->
        <link rel="stylesheet" href="css/main.css">
        
        <!--Style for "Topnav"-->
        <link rel="stylesheet" href="css/style_topnav.css">

        <!--Style for "Menu" button on top-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <title>Rheinmetall</title>
        <link rel="icon" type="image/x-icon" href="images/Rheinmetall_Favicon.png">
    </head>
    <body>

<!--TOPNAV-->

        <div class="topnav" id="myTopnav">
            <img src="images/rheinmetall-logo.svg" alt="Rheinmetall" class="rheinmetall-logo">
            <a href="#news" class="but1">News</a>
            <a href="#contact" class="but1">Contact</a>
            <a href="#about" class="but1">About</a>
            <a href="javascript:void(0);" class="icon" onclick="myFunction()">
                <i class="fa fa-bars"></i>
            </a>
        </div>

        <script>
            function myFunction() {
                var x = document.getElementById("myTopnav");
                if (x.className === "topnav") {
                    x.className += " responsive";
                } else {
                    x.className = "topnav";
                }
            }
        </script>
    </body>
</html>
